line-length = 100
target-version = "py313"
force-exclude = true
# The old engine and the prototypes, until #39 removes them.
extend-exclude = [
  "apps",
  "notebooks",
  "src/opaprikkie_sim",
  "tests/__init__.py",
  "tests/integration",
  "tests/test_*.py",
  "tests/unit",
]

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF", "ANN"]

[lint.per-file-ignores]
"tests/**" = ["ANN"]
