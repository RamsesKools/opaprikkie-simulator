[project]
name = "opaprikkie-backend"
version = "0.0.0"
description = "Opa Prikkie game API, a sample for the #6 frontend comparison"
requires-python = ">=3.11"
dependencies = [
  "opaprikkie-sim",
  "fastapi",
  "uvicorn",
]

[project.scripts]
opaprikkie-backend = "opaprikkie_backend.app:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
opaprikkie-sim = { path = "../..", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"
