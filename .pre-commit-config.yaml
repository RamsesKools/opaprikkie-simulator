# The old engine and the prototypes, until #39 removes them.
exclude: ^(apps/|src/opaprikkie_sim/|tests/(unit|integration)/|tests/test_[^/]*\.py$|tests/__init__\.py$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-ast
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies: [mdformat-gfm, mdformat-frontmatter]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: version-sync
        name: version sync
        entry: python scripts/version.py check
        language: python
        files: ^(pyproject\.toml|frontend/package\.json)$
        pass_filenames: false
      - id: oxfmt
        name: oxfmt
        entry: npm --prefix frontend exec -- oxfmt --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|html)$
      - id: oxlint
        name: oxlint
        entry: npm --prefix frontend exec -- oxlint -c frontend/.oxlintrc.json --fix --deny-warnings --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
      - id: tsc
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx|json)$
        pass_filenames: false
      - id: vitest
        name: vitest related
        entry: bash -c 'cd frontend && npm exec -- vitest related --run "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: vitest-all
        name: vitest all
        entry: npm --prefix frontend exec -- vitest run --root frontend
        language: system
        files: ^frontend/(vite\.config\.ts|src/test_setup\.ts|package-lock\.json)$
        pass_filenames: false
