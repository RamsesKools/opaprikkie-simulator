name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ramseskools/opaprikkie

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - id: version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        env:
          # Reproducible timestamps, so a rebuild of the same commit can match the pushed digest.
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the next version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest_of() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>/dev/null; }
          tag=$VERSION n=0 previous=
          while current=$(digest_of "$tag"); do previous=$current n=$((n + 1)) tag=$VERSION.post$n; done
          if [ "$previous" = "$DIGEST" ]; then
            echo "Unchanged since the last $VERSION tag; nothing to push."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:$tag" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "Pushed $IMAGE:$tag and latest."
