name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ramseskools/opaprikkie
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    # workflow_run also fires for pull requests from a fork's main, so require a push.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: astral-sh/setup-uv@v10.3.0
      - id: version
        run: |
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ env.SHA }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the next version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Exit 1 only when the tag doesn't exist, so a registry error can't overwrite a tag.
          digest_of() {
            local out
            if out=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>&1); then
              echo "$out"
            elif grep -qiE ': not found$|manifest unknown' <<< "$out"; then
              return 1
            else
              echo "$out" >&2
              return 2
            fi
          }
          tag=$VERSION n=0 previous=
          while true; do
            status=0
            current=$(digest_of "$tag") || status=$?
            [ "$status" -eq 1 ] && break
            [ "$status" -eq 0 ] || exit 1
            previous=$current n=$((n + 1)) tag=$VERSION.post$n
          done
          if [ "$previous" = "$DIGEST" ]; then
            echo "Unchanged since the last $VERSION tag; nothing to push."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:$tag" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "Pushed $IMAGE:$tag and latest."
