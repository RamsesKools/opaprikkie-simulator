[project]
name = "opaprikkie"
version = "0.4.0"
description = "Play and simulate the Dutch dice game Opa Prikkie"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ramses Kools", email = "14346781+RamsesKools@users.noreply.github.com" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.147.0",
    "httpx2>=2.14.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/RamsesKools/opaprikkie-simulator"

[project.scripts]
opaprikkie = "opaprikkie.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
    "ty>=0.0.89",
]
notebook = [
    "ipykernel>=7.4.0",
]

[tool.taskipy.tasks]
format = { cmd = "ruff format && ruff check --select I --fix && npm --prefix frontend run format", help = "format Python and frontend" }
lint = { cmd = "ruff check && ruff format --check && npm --prefix frontend run lint", help = "lint Python and frontend" }
typecheck = { cmd = "ty check && npm --prefix frontend run typecheck", help = "type-check Python and frontend" }
lint_imports = { cmd = "lint-imports", help = "check module boundaries" }
test = { cmd = "pytest && npm --prefix frontend test", help = "run Python and frontend tests with the coverage gates" }
check = { cmd = "task lint && task typecheck && task lint_imports && task test", help = "run every check" }
dev = { cmd = "python scripts/dev.py", help = "run the backend with reload and Vite with its /api proxy" }
bump = { cmd = "python scripts/version.py bump", help = "bump the app version: major, minor, or patch" }
wayfinder_pull = { cmd = "wayfinder-pull RamsesKools/opaprikkie-simulator 14 .plan/opa-prikkie-browser-mvp", help = "refresh the planning map cache" }

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--cov",
  "--cov-report=term-missing:skip-covered",
  "-m",
  "not container",
  # The old engine's tests, until #39 removes them.
  "--ignore=tests/integration",
  "--ignore=tests/unit",
  "--ignore-glob=tests/test_*.py",
]
markers = ["container: runs against the built Docker image"]

[tool.coverage.run]
branch = true
source = ["opaprikkie"]

[tool.coverage.report]
fail_under = 90

[tool.ty.src]
# The old engine and the prototypes, until #39 removes them.
exclude = [
  "apps",
  "notebooks",
  "src/opaprikkie_sim",
  "tests/__init__.py",
  "tests/integration",
  "tests/test_*.py",
  "tests/unit",
]

[tool.importlinter]
root_package = "opaprikkie"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "cli composes backend and sim, which share only the engine"
type = "layers"
layers = ["opaprikkie.cli", "opaprikkie.backend | opaprikkie.sim", "opaprikkie.engine"]

[[tool.importlinter.contracts]]
name = "engine uses the standard library only"
type = "forbidden"
source_modules = ["opaprikkie.engine"]
forbidden_modules = ["click", "fastapi", "httpx2", "pydantic", "pydantic_settings", "starlette", "uvicorn"]
